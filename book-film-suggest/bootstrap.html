<!DOCTYPE html>
<html lang="zh‑CN">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>书影音推荐‑Bootstrap版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ✅这里新增自定义覆盖样式，第4次才加上 -->
  <style>
    .card .card-title {
      color:#0b5ed7;
    }
  </style>
</head>
<body>

<div class="container">
  <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href=" ">书影音推荐</a >
      <div class="navbar-nav">
        <a class="nav-link active" href="#book">书籍</a >
        <a class="nav-link" href="#movie">电影</a >

  <h1 class="text-center mb-5">好书·好电影·好音乐</h1>

  <section id="book">
    <h2>📖书籍推荐</h2>
    <div class="row g-4 mb-5">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">平凡的世界</h5>
            <p class="card-text">路遥经典著作，讲述普通人在时代浪潮下的奋斗与生活。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">人类简史</h5>
            <p class="card-text">从认知革命到科学革命，重新审视人类发展历史。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="movie">
    <h2>🎬电影推荐</h2>
    <div class="row g-4 mb-5">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">流浪地球</h5>
            <p class="card-text">国产硬核科幻，人类带着地球奔赴宇宙。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">山海情</h5>
            <p class="card-text">真实改编，展现扶贫路上普通人的故事。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="music">
    <h2>🎵音乐推荐</h2>
    <div class="row g-4 mb-5">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">稻香</h5>
            <p class="card-text">温暖治愈，怀念乡土与简单的快乐。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">孤勇者</h5>
            <p class="card-text">致敬平凡勇敢的普通人。</p >
            <a href="#" class="btn btn-primary">了解更多</a >
          </div>
        </div>
      </div>

  <footer class="text-center mt-5 text-muted">
    <p>书影音推荐专题页 &copy;2026</p >
  </footer>
